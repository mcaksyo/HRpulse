services:
  # ── База данных ──
  postgres:
    image: postgres:16-alpine
    container_name: pulsehr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsehr}
      POSTGRES_USER: ${POSTGRES_USER:-pulsehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsehr_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsehr}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Кэш и брокер очередей ──
  redis:
    image: redis:7-alpine
    container_name: pulsehr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsehr-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pulsehr}:${POSTGRES_PASSWORD:-pulsehr_secret}@postgres:5432/${POSTGRES_DB:-pulsehr}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Celery Worker (асинхронные задачи) ──
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsehr-celery-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pulsehr}:${POSTGRES_PASSWORD:-pulsehr_secret}@postgres:5432/${POSTGRES_DB:-pulsehr}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A tasks worker --loglevel=info --pool=solo
    restart: unless-stopped

  # ── Celery Beat (расписание) ──
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsehr-celery-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pulsehr}:${POSTGRES_PASSWORD:-pulsehr_secret}@postgres:5432/${POSTGRES_DB:-pulsehr}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A tasks beat --loglevel=info
    restart: unless-stopped

  # ── Frontend (dev-режим) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsehr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
